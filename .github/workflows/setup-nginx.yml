name: Setup Nginx site + HTTPS

# 只允许手动触发。在 GitHub → Actions → "Setup Nginx site + HTTPS" → Run workflow。
#
# 作用：为正式站点域名在服务器 Nginx 上创建反向代理站点（指向本机应用端口），
# 并用 certbot 申请 Let's Encrypt 证书、开启 HTTP→HTTPS 跳转。
#
# 说明：脚本是幂等的，重复执行不会产生副作用；执行前会自动备份 /etc/nginx。
# 已存在的其他站点（如脱敏演示版 chat.yuniagent.ai）不会被改动。
on:
  workflow_dispatch:
    inputs:
      domain:
        description: 站点域名
        required: true
        default: ai.fuyunhon.com
      upstream_port:
        description: 应用在服务器本机监听的端口
        required: true
        default: "8000"
      enable_https:
        description: 是否申请证书并开启 HTTPS 跳转
        type: boolean
        required: true
        default: true
      certbot_email:
        description: Let's Encrypt 通知邮箱（证书到期提醒）
        required: true
        default: yunitechhk@gmail.com

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Nginx over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          password: ${{ secrets.ECS_PASSWORD }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -e

            DOMAIN="${{ inputs.domain }}"
            UPSTREAM_PORT="${{ inputs.upstream_port }}"
            ENABLE_HTTPS="${{ inputs.enable_https }}"
            CERTBOT_EMAIL="${{ inputs.certbot_email }}"

            if [ "$(id -u)" -ne 0 ]; then SUDO="sudo"; else SUDO=""; fi

            echo "=== 0. 前置检查 ==="
            command -v nginx >/dev/null || { echo "服务器上没有安装 nginx"; exit 1; }
            [ -d /etc/nginx/sites-enabled ] || { echo "缺少 /etc/nginx/sites-enabled 目录"; exit 1; }

            # 应用必须已经在本机端口上正常响应，否则配了反代也是 502
            if ! curl -fsS -m 10 "http://127.0.0.1:${UPSTREAM_PORT}/health" > /tmp/upstream_health.txt; then
              echo "应用在 127.0.0.1:${UPSTREAM_PORT} 上无响应，请先确认容器已启动"
              exit 1
            fi
            echo "上游应用响应：$(cat /tmp/upstream_health.txt)"

            echo "=== 1. 备份现有 Nginx 配置 ==="
            BACKUP="/etc/nginx.bak.$(date +%Y%m%d%H%M%S)"
            $SUDO cp -a /etc/nginx "$BACKUP"
            echo "已备份到 $BACKUP"

            echo "=== 2. 写入站点配置 ==="
            # 注意：nginx 内置变量用 \$ 转义，避免被 shell 提前展开
            $SUDO tee "/etc/nginx/sites-available/${DOMAIN}" > /dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;
                server_name ${DOMAIN};

                # 上传/长文本提问留出余量
                client_max_body_size 10m;

                location / {
                    proxy_pass http://127.0.0.1:${UPSTREAM_PORT};
                    proxy_http_version 1.1;

                    proxy_set_header Host              \$host;
                    proxy_set_header X-Real-IP         \$remote_addr;
                    proxy_set_header X-Forwarded-For   \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;

                    # 客服工作台的实时推送依赖 WebSocket
                    proxy_set_header Upgrade    \$http_upgrade;
                    proxy_set_header Connection "upgrade";

                    # 前台轮询与 WebSocket 长连接，避免被过早断开
                    proxy_read_timeout  3600s;
                    proxy_send_timeout  3600s;
                    proxy_buffering     off;
                }
            }
            EOF

            $SUDO ln -sfn "/etc/nginx/sites-available/${DOMAIN}" "/etc/nginx/sites-enabled/${DOMAIN}"

            echo "=== 3. 校验并重载 ==="
            if ! $SUDO nginx -t; then
              # 本次只新增了一个站点文件和一个软链，撤掉软链即可恢复原状，
              # 不动 /etc/nginx 其余内容（完整备份仍保留在 $BACKUP 备查）
              echo "配置校验失败，撤销本次新增的站点软链"
              $SUDO rm -f "/etc/nginx/sites-enabled/${DOMAIN}"
              $SUDO nginx -t && echo "已恢复到改动前的可用状态（备份：$BACKUP）"
              exit 1
            fi
            $SUDO systemctl reload nginx

            echo "=== 4. 验证反代命中的是正确的上游 ==="
            sleep 2
            VIA_NGINX=$(curl -fsS -m 10 -H "Host: ${DOMAIN}" http://127.0.0.1/health)
            DIRECT=$(cat /tmp/upstream_health.txt)
            echo "经 Nginx : $VIA_NGINX"
            echo "直连应用 : $DIRECT"
            if [ "$VIA_NGINX" != "$DIRECT" ]; then
              echo "反代结果与直连不一致，说明请求没有落到预期的应用实例上"
              exit 1
            fi
            echo "反代目标正确。"

            if [ "$ENABLE_HTTPS" != "true" ]; then
              echo "=== 跳过 HTTPS（enable_https=false）==="
              exit 0
            fi

            echo "=== 5. 申请证书并开启 HTTPS 跳转 ==="
            if ! command -v certbot >/dev/null; then
              echo "安装 certbot..."
              $SUDO apt-get update -qq
              $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq certbot python3-certbot-nginx
            fi

            # --keep-until-expiring 保证重复执行时不会重复申请、不触发 Let's Encrypt 限流
            $SUDO certbot --nginx \
              -d "${DOMAIN}" \
              --non-interactive \
              --agree-tos \
              -m "${CERTBOT_EMAIL}" \
              --redirect \
              --keep-until-expiring

            $SUDO nginx -t
            $SUDO systemctl reload nginx

            echo "=== 6. 最终验证 ==="
            echo "--- HTTPS 证书 ---"
            echo | openssl s_client -connect "127.0.0.1:443" -servername "${DOMAIN}" 2>/dev/null \
              | openssl x509 -noout -subject -dates 2>/dev/null || echo "(证书信息读取失败，可忽略)"

            echo "--- HTTP 是否跳转到 HTTPS ---"
            curl -sS -o /dev/null -D - -m 10 -H "Host: ${DOMAIN}" http://127.0.0.1/health | head -n 5 || true

            echo "--- HTTPS 内容 ---"
            curl -fsS -m 10 --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/health"
            echo ""

            echo "=== 完成 ==="
            echo "客户前台：https://${DOMAIN}"
            echo "客服工作台：https://${DOMAIN}/agent"
